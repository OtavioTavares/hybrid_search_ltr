<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .b { stroke-width: 1.4; rx: 8; }
      .neutral { fill: #f3f4f6; stroke: #9ca3af; }
      .ret { fill: #e8f0fe; stroke: #4a74c9; }
      .rank { fill: #fdf0e3; stroke: #d9822b; }
      .t { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .s { font-size: 11px; fill: #4b5563; text-anchor: middle; }
      .lbl { font-size: 11px; font-weight: 700; fill: #6b7280; letter-spacing: 1px; }
      .ln { stroke: #6b7280; stroke-width: 1.3; fill: none; }
    </style>
  </defs>
  <rect width="920" height="310" fill="#ffffff"/>

  <text class="lbl" x="10" y="18">POR BUSCA</text>
  <g transform="translate(0,40)">
    <path class="ln" d="M230,26 C230,2 695,2 695,36" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text class="s" x="462" y="4">scores do catálogo inteiro reaproveitados como features</text>

    <rect class="b neutral" x="10" y="36" width="120" height="60"/>
    <text class="t" x="70" y="62">Busca</text>
    <text class="s" x="70" y="80">NFKC · até 200 car.</text>

    <rect class="b ret" x="165" y="26" width="130" height="38"/>
    <text class="t" x="230" y="42">BM25</text>
    <text class="s" x="230" y="57">43 mil produtos</text>
    <rect class="b ret" x="165" y="70" width="130" height="38"/>
    <text class="t" x="230" y="86">MiniLM</text>
    <text class="s" x="230" y="101">cosseno, 384 dim</text>

    <rect class="b ret" x="330" y="36" width="120" height="60"/>
    <text class="t" x="390" y="62">RRF (k = 60)</text>
    <text class="s" x="390" y="80">top 100 de cada</text>

    <rect class="b ret" x="485" y="36" width="115" height="60"/>
    <text class="t" x="542" y="62">100 candidatos</text>
    <text class="s" x="542" y="80">entrada do ranker</text>

    <rect class="b rank" x="635" y="36" width="120" height="60"/>
    <text class="t" x="695" y="62">17 features</text>
    <text class="s" x="695" y="80">4 grupos</text>

    <rect class="b rank" x="790" y="36" width="120" height="60"/>
    <text class="t" x="850" y="62">LambdaMART</text>
    <text class="s" x="850" y="80">reordena → top k</text>

    <path class="ln" d="M130,60 L163,46" marker-end="url(#a)"/>
    <path class="ln" d="M130,72 L163,88" marker-end="url(#a)"/>
    <path class="ln" d="M295,45 L328,58" marker-end="url(#a)"/>
    <path class="ln" d="M295,89 L328,74" marker-end="url(#a)"/>
    <path class="ln" d="M450,66 L483,66" marker-end="url(#a)"/>
    <path class="ln" d="M600,66 L633,66" marker-end="url(#a)"/>
    <path class="ln" d="M755,66 L788,66" marker-end="url(#a)"/>

    <path class="ln" d="M165,118 L165,124 L600,124 L600,118"/>
    <text class="s" x="382" y="140">retrieval: p50 10,9 ms · p95 12,9 ms</text>
    <path class="ln" d="M635,118 L635,124 L910,124 L910,118"/>
    <text class="s" x="772" y="140">ranking: p50 2,7 ms · p95 3,1 ms</text>
  </g>

  <line x1="10" y1="200" x2="910" y2="200" stroke="#e5e7eb" stroke-width="1.2"/>
  <text class="lbl" x="10" y="222">OFFLINE</text>
  <g transform="translate(0,234)">
    <rect class="b neutral" x="10" y="0" width="120" height="62"/>
    <text class="t" x="70" y="26">Catálogo</text>
    <text class="s" x="70" y="44">42.994 produtos</text>

    <rect class="b ret" x="165" y="0" width="200" height="62"/>
    <text class="t" x="265" y="22">build-index</text>
    <text class="s" x="265" y="39">BM25: 2 s, 20 MB</text>
    <text class="s" x="265" y="54">embeddings: 170 s, 66 MB</text>

    <rect class="b rank" x="400" y="0" width="240" height="62"/>
    <text class="t" x="520" y="22">Exemplos de treino</text>
    <text class="s" x="520" y="39">287 buscas × 100 candidatos × 17 features</text>
    <text class="s" x="520" y="54">rótulo: Exact 2 · Partial 1 · resto 0</text>

    <rect class="b rank" x="675" y="0" width="235" height="62"/>
    <text class="t" x="792" y="22">Treino LambdaMART</text>
    <text class="s" x="792" y="39">early stopping no nDCG@10</text>
    <text class="s" x="792" y="54">da validação: 74 árvores</text>

    <path class="ln" d="M130,31 L163,31" marker-end="url(#a)"/>
    <path class="ln" d="M365,31 L398,31" marker-end="url(#a)"/>
    <path class="ln" d="M640,31 L673,31" marker-end="url(#a)"/>
  </g>
</svg>
